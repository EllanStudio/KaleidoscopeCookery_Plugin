name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build plugin
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test and build shadow JAR
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64
        run: |
          chmod +x gradlew
          ./gradlew clean test shadowJar --no-daemon --stacktrace

      - name: Upload plugin JAR
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: KaleidoscopeCookeryPlugin-${{ github.sha }}
          path: build/libs/KaleidoscopeCookeryPlugin-*.jar
          if-no-files-found: error
          retention-days: 14
